<rect x="458" y="670" width="112" height="22" rx="11" fill="#edf1ff"/><text x="514" y="685" text-anchor="middle" fill="#5269bf" font-size="10" font-weight="700" font-family="Arial">Acompanhamento</text>
<text x="346" y="720" class="muted" font-size="13" font-family="Arial">Apresentou melhora na entrega das atividades. Manter acompanhamento por mais duas semanas.</text>
