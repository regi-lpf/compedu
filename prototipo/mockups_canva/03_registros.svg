<rect x="488" y="545" width="62" height="22" rx="11" fill="#eaf7ef"/><text x="519" y="560" text-anchor="middle" fill="#2d8a61" font-size="10" font-weight="700" font-family="Arial">Positivo</text>
<text x="346" y="595" class="muted" font-size="13" font-family="Arial">Participou da atividade em grupo e ajudou colegas na resolução dos exercícios.</text>
